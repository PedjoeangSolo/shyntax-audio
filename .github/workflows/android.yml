name: Build SHYNTAX AUDIO APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "ui/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid android-actions/setup-android@v3 here: its default setup attempts
      # to install the retired "tools" SDK package and fails before Gradle runs.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Media3 FFmpeg ALAC decoder
        shell: bash
        run: |
          set -euo pipefail
          MEDIA3_SOURCE_DIR="$RUNNER_TEMP/androidx-media"
          git clone --depth 1 --branch 1.5.1 https://github.com/androidx/media.git "$MEDIA3_SOURCE_DIR"
          # The app minSdk is 26. Match the Media3 FFmpeg native target to it;
          # API 21 can leave Android stdio symbols such as stderr unresolved.
          cat >> "$MEDIA3_SOURCE_DIR/libraries/decoder_ffmpeg/build.gradle" <<'GRADLE'
          android {
              defaultConfig {
                  minSdkVersion 26
              }
          }
          GRADLE
          FFMPEG_DIR="$MEDIA3_SOURCE_DIR/libraries/decoder_ffmpeg/src/main/jni/ffmpeg"
          git clone --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git "$FFMPEG_DIR"
          FFMPEG_MODULE_PATH="$MEDIA3_SOURCE_DIR/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          test -x "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          cd "$FFMPEG_MODULE_PATH/jni"
          bash ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 26 alac
          echo "MEDIA3_SOURCE_DIR=$MEDIA3_SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/shyntax-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug and signed release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHYNTAX-AUDIO-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHYNTAX-AUDIO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
